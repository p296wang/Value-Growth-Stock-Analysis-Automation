[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Classify a stock as value or growth using the COMM 101 stock picking methodology."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
web = ["flask>=3"]
dev = ["pytest>=8", "flask>=3"]

[project.scripts]
analyze = "stock_analyzer.cli:main"
analyze-web = "stock_analyzer.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_analyzer = ["criteria.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
